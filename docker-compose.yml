version: '3.9'

services:

  countries-mvc:
    image: tooba52/countries-mvc:0.0.1.RELEASE
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - countries-db
    networks:
      - countries-network


  countries-db:
    #image name
    image: tooba52/countries-db:0.0.1.RELEASE 
    #hostport:container port 5432 = db postgre port number
    ports:
      - "5432:5432"
    #automaticallr estart when container stops
    restart: always
    networks:
      - countries-network

networks:
  countries-network: